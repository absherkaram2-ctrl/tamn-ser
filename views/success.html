<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تم الدفع بنجاح</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow: hidden;
        position: relative;
      }

      /* Animated background particles */
      .particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        50% {
          transform: translateY(-20px) rotate(180deg);
          opacity: 0.8;
        }
      }

      .container {
        background: white;
        border-radius: 24px;
        padding: 50px 40px;
        max-width: 550px;
        width: 100%;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.3);
        text-align: center;
        animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        z-index: 10;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-40px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .success-icon {
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 30px;
        animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        box-shadow:
          0 10px 40px rgba(76, 175, 80, 0.4),
          0 0 0 8px rgba(76, 175, 80, 0.1);
        position: relative;
      }

      .success-icon::before {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 2px solid rgba(76, 175, 80, 0.2);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.5;
        }
      }

      @keyframes scaleIn {
        0% {
          transform: scale(0) rotate(-180deg);
        }
        50% {
          transform: scale(1.1) rotate(10deg);
        }
        100% {
          transform: scale(1) rotate(0deg);
        }
      }

      .success-icon::after {
        content: "✓";
        color: white;
        font-size: 65px;
        font-weight: bold;
        animation: checkmark 0.5s ease-out 0.5s both;
      }

      @keyframes checkmark {
        from {
          opacity: 0;
          transform: scale(0);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      h1 {
        color: #1a1a1a;
        margin-bottom: 15px;
        font-size: 32px;
        font-weight: 700;
        animation: fadeIn 0.6s ease-out 0.6s both;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .subtitle {
        color: #666;
        font-size: 17px;
        line-height: 1.7;
        margin-bottom: 35px;
        animation: fadeIn 0.6s ease-out 0.7s both;
      }

      .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 16px 45px;
        border-radius: 50px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        animation: fadeIn 0.6s ease-out 1s both;
        position: relative;
        overflow: hidden;
      }

      .btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }

      .btn:hover::before {
        width: 300px;
        height: 300px;
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
      }

      .btn:active {
        transform: translateY(-1px);
      }

      .payment-details {
        background: linear-gradient(135deg, #f8f9ff 0%, #f0f2ff 100%);
        padding: 25px;
        border-radius: 16px;
        margin: 30px 0;
        text-align: right;
        border: 1px solid rgba(102, 126, 234, 0.1);
        animation: fadeIn 0.6s ease-out 0.8s both;
      }

      .payment-details p {
        margin: 12px 0;
        color: #444;
        font-size: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .payment-details strong {
        color: #667eea;
        font-weight: 600;
      }

      .status-badge {
        display: inline-block;
        padding: 6px 16px;
        background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
        color: white;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
      }

      .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #667eea;
        animation: confetti-fall 3s linear infinite;
      }

      @keyframes confetti-fall {
        to {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }

      .divider {
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(102, 126, 234, 0.3) 50%,
          transparent 100%
        );
        margin: 25px 0;
        animation: fadeIn 0.6s ease-out 0.9s both;
      }

      @media (max-width: 600px) {
        .container {
          padding: 40px 30px;
        }

        h1 {
          font-size: 26px;
        }

        .success-icon {
          width: 100px;
          height: 100px;
        }

        .success-icon::after {
          font-size: 55px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="success-icon"></div>
      <h1>تم الدفع بنجاح!</h1>
      <p class="subtitle">
        شكراً لك، تمت عملية الدفع بنجاح. سيتم معالجة طلبك في أقرب وقت.
      </p>

      <div class="divider"></div>

      <div class="payment-details">
        <p>
          <strong>حالة الدفع:</strong>
          <span class="status-badge">مكتمل</span>
        </p>
        <p>
          <strong>التاريخ:</strong>
          <span id="date"></span>
        </p>
      </div>
    </div>

    <script>
      document.getElementById("date").textContent =
        new Date().toLocaleDateString("ar-SA", {
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });

      // Create animated background particles
      function createParticles() {
        const colors = ["#667eea", "#764ba2", "#4caf50", "#ffffff"];
        for (let i = 0; i < 15; i++) {
          const particle = document.createElement("div");
          particle.className = "particle";
          particle.style.width = Math.random() * 8 + 4 + "px";
          particle.style.height = particle.style.width;
          particle.style.left = Math.random() * 100 + "%";
          particle.style.top = Math.random() * 100 + "%";
          particle.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          particle.style.animation = `float ${Math.random() * 3 + 2}s ease-in-out infinite`;
          particle.style.animationDelay = Math.random() * 2 + "s";
          particle.style.opacity = Math.random() * 0.5 + 0.2;
          document.body.appendChild(particle);
        }
      }

      // Create confetti effect
      function createConfetti() {
        const colors = ["#667eea", "#764ba2", "#4caf50", "#ffd700", "#ff69b4"];
        for (let i = 0; i < 30; i++) {
          const confetti = document.createElement("div");
          confetti.className = "confetti";
          confetti.style.left = Math.random() * 100 + "%";
          confetti.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDelay = Math.random() * 0.5 + "s";
          confetti.style.animationDuration = Math.random() * 2 + 2 + "s";
          document.body.appendChild(confetti);

          setTimeout(() => confetti.remove(), 3000);
        }
      }

      createParticles();
      createConfetti();

      // Auto close after 8 seconds
      setTimeout(() => {
        window.close();
      }, 8000);
    </script>
  </body>
</html>
